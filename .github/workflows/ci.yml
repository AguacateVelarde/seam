name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bunx biome ci .

      - name: Build, typecheck, test (Turbo)
        run: bunx turbo build typecheck test

  e2e:
    name: API integration test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seam
          POSTGRES_PASSWORD: seam
          POSTGRES_DB: seam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run end-to-end API tests
        run: bun run --cwd apps/server e2e
        env:
          DATABASE_URL: postgres://seam:seam@localhost:5432/seam
