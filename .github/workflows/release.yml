name: Release

# Changesets flow: contributors add changesets (`bunx changeset`); this
# workflow maintains a "Version Packages" PR that bumps versions and
# changelogs. Merging that PR versions the packages. npm publishing can be
# enabled later by adding an NPM_TOKEN secret and a publish command below.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update Version Packages PR
        uses: changesets/action@v1
        with:
          version: bunx changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
