# Development infrastructure only — run the server and studio locally with
# `bun dev` (hot reload). Exposes postgres and redis on their default ports.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${SEAM_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: seam
      POSTGRES_PASSWORD: seam
      POSTGRES_DB: seam
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seam"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${SEAM_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
