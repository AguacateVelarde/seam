services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://seam:seam@postgres:5432/seam
      REDIS_URL: redis://redis:6379
      PORT: 3000
      SEAM_AUTO_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  studio:
    build:
      context: .
      dockerfile: apps/studio/Dockerfile
      args:
        VITE_SEAM_SERVER_URL: ${SEAM_SERVER_URL:-http://localhost:3000}
        VITE_SEAM_ADMIN_KEY: ${SEAM_ADMIN_KEY:-}
    ports:
      - "${STUDIO_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seam
      POSTGRES_PASSWORD: seam
      POSTGRES_DB: seam
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seam"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
